const PWKEY = "aroma-pw:" + location.pathname;
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(PAYLOAD.s), iterations: PAYLOAD.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const slot of PAYLOAD.slots) {
    let opened;
    try {
      opened = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(slot.i) }, key, bytes(slot.k))));
    } catch (e) { continue; } // not this password's copy
    const tool = await crypto.subtle.importKey("raw", bytes(opened.key), "AES-GCM", false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(PAYLOAD.i) }, tool, bytes(PAYLOAD.c)));
    return html.replace("__INSTRUCTOR__", opened.mode === "instructor" ? "yes" : "no");
  }
  throw new Error("wrong password");
}
async function go(pw, quiet) {
  const msg = document.getElementById("msg"), btn = document.getElementById("b");
  if (!quiet) { msg.textContent = ""; btn.disabled = true; btn.textContent = "Opening…"; }
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem(PWKEY, pw); } catch (e) { /* fine */ }
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem(PWKEY); } catch (e2) { /* fine */ }
    if (!quiet) { msg.textContent = "That password doesn't open this page."; btn.disabled = false; btn.textContent = "Open"; }
  }
}
if (!window.crypto || !crypto.subtle) {
  document.getElementById("msg").textContent = "This page has to be opened from a secure (https) address.";
} else {
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); go(document.getElementById("p").value, false); });
  let saved = null;
  try { saved = sessionStorage.getItem(PWKEY); } catch (e) { /* fine */ }
  if (saved) go(saved, true); // a refresh in the same browser tab doesn't ask again
}
